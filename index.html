<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Cuenta atrás ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #ffd1e6;
      --bg2: #ffb6d5;
      --text: #1a1a1a;
      --muted: rgba(20,20,20,0.7);
      --card: rgba(255, 255, 255, 0.78);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, var(--bg), var(--bg2) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    /* Fondo animado OPTIMIZADO */
    .bg-emojis {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .emoji {
      position: absolute;
      bottom: -60px;
      user-select: none;
      will-change: transform, opacity;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-900px); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border-radius: 24px;
      padding: 28px 22px 24px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(10px);
    }

    h1 { font-size: 1.7rem; margin-bottom: 6px; }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 480px) {
      .countdown { grid-template-columns: repeat(4, 1fr); }
    }

    .unit {
      background: rgba(255,255,255,0.6);
      border-radius: 18px;
      padding: 12px 8px;
      text-align: center;
    }

    .value { font-size: 1.8rem; font-weight: 700; }
    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .row {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    button {
      border: 0;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 800;
      background: #ff4d7d;
      color: white;
    }

    .status {
      text-align: center;
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.35;
    }

    .final {
      display: none;
      margin-top: 14px;
      text-align: center;
      font-weight: 900;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>
  <div class="bg-emojis" id="bgEmojis"></div>

  <div class="container">
    <h1>Tiempo hasta...</h1>
    <p class="subtitle">
      Esta cuenta atrás está hecha para que vayas viendo cuántos días quedan para la sorpresita que te tengo jiji.
    </p>

    <div class="countdown">
      <div class="unit"><div class="value" id="days">–</div><div class="label">Días</div></div>
      <div class="unit"><div class="value" id="hours">–</div><div class="label">Horas</div></div>
      <div class="unit"><div class="value" id="minutes">–</div><div class="label">Minutos</div></div>
      <div class="unit"><div class="value" id="seconds">–</div><div class="label">Segundos</div></div>
    </div>

    <div class="row">
      <button id="enableSound">🔊 Activar sonido</button>
    </div>

    <div class="status" id="status">
      Activa el sonido, y cuando llegue a 0 tendrás una sorpresita jijij
    </div>

    <div class="final" id="finalMsg">¡¡Llegó el momento!! ❤️</div>

    <audio id="song" preload="auto">
      <source src="media-luna.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
    const targetDate = new Date("2026-01-06T00:00:00").getTime();

    // 🔥 FONDO OPTIMIZADO
    const bg = document.getElementById("bgEmojis");
    const EMOJIS = ["❤️", "💘", "🐽", "💝"];
    const COUNT = 28; // 👈 fluido

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnEmoji() {
      const el = document.createElement("div");
      el.className = "emoji";
      el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

      el.style.left = rand(0, 100) + "%";
      el.style.fontSize = rand(22, 40) + "px";
      el.style.animationDuration = rand(8, 14) + "s";

      bg.appendChild(el);

      setTimeout(() => el.remove(), 15000);
    }

    // crear en oleadas (MUCHO más fluido)
    setInterval(spawnEmoji, 600);

    // Contador
    const d = document.getElementById("days");
    const hh = document.getElementById("hours");
    const mm = document.getElementById("minutes");
    const ss = document.getElementById("seconds");
    const finalMsg = document.getElementById("finalMsg");

    function pad(n) { return n < 10 ? "0" + n : String(n); }

    // Sonido
    const btn = document.getElementById("enableSound");
    const statusEl = document.getElementById("status");
    const song = document.getElementById("song");

    const statusOffText = "Activa el sonido, y cuando llegue a 0 tendrás una sorpresita jijij";
    const statusOnText  = "Música activadaaa 🎶";

    let soundEnabled = false;
    let finished = false;

    btn.addEventListener("click", async () => {
      if (!soundEnabled) {
        try {
          await song.play();
          song.pause();
          song.currentTime = 0;
          soundEnabled = true;
          btn.textContent = "🔊 Música activadaaa";
          statusEl.textContent = statusOnText;
        } catch (e) {
          statusEl.textContent = "No se pudo activar el sonido 😢";
        }
      } else {
        soundEnabled = false;
        btn.textContent = "🔊 Activar sonido";
        statusEl.textContent = statusOffText;
      }
    });

    function tick() {
      const now = Date.now();
      const diff = targetDate - now;

      if (diff <= 0) {
        d.textContent = hh.textContent = mm.textContent = ss.textContent = "00";
        finalMsg.style.display = "block";

        if (!finished && soundEnabled) {
          finished = true;
          song.currentTime = 0;
          song.play().catch(() => {});
        }
        return;
      }

      const t = Math.floor(diff / 1000);
      d.textContent  = pad(Math.floor(t / 86400));
      hh.textContent = pad(Math.floor((t % 86400) / 3600));
      mm.textContent = pad(Math.floor((t % 3600) / 60));
      ss.textContent = pad(t % 60);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
